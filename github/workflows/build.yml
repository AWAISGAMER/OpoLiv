name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. Unzip OPO_LIVE_Flutter_Starter.zip
    - name: Extract Project Zip
      run: |
        unzip -o OPO_LIVE_Flutter_Starter.zip || true
        find . -name "*.zip" -exec unzip -o {} \; || true
        
        PUBSPEC_PATH=$(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1)
        if [ -n "$PUBSPEC_PATH" ]; then
          FLUTTER_DIR=$(dirname "$PUBSPEC_PATH")
          echo "Found pubspec.yaml in: $FLUTTER_DIR"
          if [ "$FLUTTER_DIR" != "." ]; then
            cp -r $FLUTTER_DIR/* .
          fi
        else
          echo "pubspec.yaml missing!"
          exit 1
        fi

    # 2. Setup Java
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Setup Flutter
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. Get Dependencies & Build APK
    - name: Build Release APK
      run: |
        flutter pub get
        flutter build apk --release --no-tree-shake-icons

    # 5. Upload APK Output
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: OpoLive-Release-APK
        path: build/app/outputs/flutter-apk/app-release.apk 
